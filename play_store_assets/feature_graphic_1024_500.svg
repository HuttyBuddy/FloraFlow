<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <!-- Dark soil field landscape gradient base -->
    <linearGradient id="mainBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1E1A" />
      <stop offset="60%" stop-color="#142B24" />
      <stop offset="100%" stop-color="#23463B" />
    </linearGradient>

    <!-- Warm sunlit morning glow overlay -->
    <radialGradient id="sunGlow" cx="20%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE2C4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
     radialGradient>

    <!-- Glowing moonlight sage gradients for foliage highlights -->
    <linearGradient id="foliageSageGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A6C5E" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ACCFC6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="foliageGoldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#553F28" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E2C4A2" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle shadows for visual hierarchy -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Elegant Deep Gradient Background Canvas -->
  <rect width="1024" height="500" fill="url(#mainBgGrad)" />
  <rect width="1024" height="500" fill="url(#sunGlow)" />

  <!-- 2. Gentle Geometric Landscape Hills to simulate organic contours -->
  <path d="M-100,530 Q250,420 600,480 T1150,420 L1150,550 L-100,550 Z" fill="#152B24" opacity="0.4" />
  <path d="M-100,530 Q150,450 500,500 T1150,450 L1150,550 L-100,550 Z" fill="#11221D" opacity="0.6" />

  <!-- 3. DECORATIVE BOTANICAL VECTORS (Lush Golden-Sage Organic Canvas Frame) -->
  <!-- Left Side: Towering majestic ferns and organic leaves -->
  <g transform="translate(80, 480) scale(1.6)" filter="url(#softShadow)">
    <path d="M0,0 C-20,-80 -40,-130 -80,-150 C-60,-110 -30,-60 0,0" fill="url(#foliageSageGrad)" />
    <path d="M0,0 C-5,-90 10,-150 -10,-190 C5,-120 10,-60 0,0" fill="url(#foliageGoldGrad)" />
    <path d="M0,0 C15,-70 40,-120 15,-155 C20,-90 15,-50 0,0" fill="url(#foliageSageGrad)" />
  </g>

  <!-- Right Side Background: Soft organic tall grass stems mirroring garden rows -->
  <g transform="translate(930, 470) scale(1.4)">
    <path d="M0,0 C20,-90 50,-140 80,-175 C55,-105 25,-55 0,0" fill="url(#foliageSageGrad)" opacity="0.8" />
    <path d="M0,0 C5,-100 -20,-160 5,-210 C-10,-130 -5,-70 0,0" fill="url(#foliageGoldGrad)" />
    <path d="M0,0 C-15,-80 -30,-120 -15,-145 C-10,-90 -5,-50 0,0" fill="url(#foliageSageGrad)" opacity="0.5" />
  </g>

  <!-- 4. FLOATING WEATHER ACCENT PARTICLES (Simulating Garden microclimate features) -->
  <!-- Sparkling soft yellow fireflies -->
  <circle cx="210" cy="120" r="6" fill="#FFE2C4" opacity="0.4" filter="url(#softShadow)" />
  <circle cx="210" cy="120" r="1.5" fill="#FFFFFF" />
  <circle cx="780" cy="80" r="8" fill="#FFE2C4" opacity="0.3" />
  <circle cx="780" cy="80" r="2" fill="#FFFFFF" />
  <circle cx="430" cy="190" r="5" fill="#ACCFC6" opacity="0.5" />

  <!-- Rain droplets slanted dynamically -->
  <line x1="880" y1="120" x2="890" y2="150" stroke="#ACCFC6" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />
  <line x1="910" y1="130" x2="920" y2="160" stroke="#ACCFC6" stroke-width="1.5" opacity="0.2" stroke-linecap="round" />
  <line x1="850" y1="180" x2="860" y2="210" stroke="#ACCFC6" stroke-width="1.5" opacity="0.3" stroke-linecap="round" />

  <!-- Gentle floating cherry blossom leaf shape -->
  <path d="M120,240 C130,235 145,245 135,255 C125,260 115,245 120,240" fill="#ACCFC6" opacity="0.4" />

  <!-- 5. CENTER BRAND CONTENT (Clean Premium Typography Setup) -->
  <g transform="translate(512, 230)" text-anchor="middle" filter="url(#softShadow)">
    
    <!-- Stylized Top Mini Logo Icon -->
    <g transform="translate(0, -110) scale(0.18)">
      <circle cx="0" cy="0" r="236" fill="url(#bgGrad)" />
      <!-- Left Leaf -->
      <path d="M0,80 C0,80 -105,23 -105,-72 C-105,-138 -39,-129 -20,-100 C-15,-93 -10,-82 -10,-72 C-10,-34 0,4 0,80 Z" fill="#ACCFC6" />
      <!-- Right Leaf -->
      <path d="M0,80 C0,80 -19,-24 47,-100 C94,-157 142,-138 124,-62 C105,4 38,51 0,80 Z" fill="#E2C4A2" />
    </g>

    <!-- Main App Title Logo (Faux-Serif Handcrafted Display) -->
    <text y="-10" font-family="'Cinzel', 'Playfair Display', 'Didot', 'Georgia', 'Times New Roman', serif" 
          font-size="64" font-weight="bold" fill="#E2C4A2" letter-spacing="4">FloraFlow</text>
    
    <!-- Subtitle (Tracking spaced-out uppercase sans-serif) -->
    <text y="35" font-family="'Montserrat', 'Space Grotesk', 'Helvetica Neue', sans-serif" 
          font-size="18" font-weight="900" fill="#ACCFC6" letter-spacing="9">DREAM GARDEN DESIGNER</text>

    <!-- Core Tagline Bullet -->
    <text y="75" font-family="'Space Grotesk', 'Inter', 'Segoe UI', sans-serif" 
          font-size="14" font-style="italic" fill="#E5E2D9" letter-spacing="1.5" opacity="0.8">Design companion layouts, simulate climate, and track mental wellness</text>
  </g>

  <!-- 6. HIGH-CONTRAST ABSTRACT PREVIEW MOCKUP RING MOCKING CLIMATE METERS -->
  <!-- Concentric tech dashboard rings orbiting the background -->
  <circle cx="512" cy="230" r="280" fill="none" stroke="#E2C4A2" stroke-width="0.8" opacity="0.12" />
  <circle cx="512" cy="230" r="320" fill="none" stroke="#ACCFC6" stroke-width="0.5" stroke-dasharray="10 20" opacity="0.15" />
</svg>
